<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Sentinel Vision - Media Upload</title>
    <style>
      body { font-family: Arial, sans-serif; background-color: #0f172a; color: #f8fafc; text-align: center; padding-top: 50px; }
      .card { background-color: #1e293b; max-width: 500px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3); }
      input[type="file"] { margin: 20px 0; }
      button { background-color: #22c55e; color: white; border: none; padding: 10px 20px; font-size: 20px; border-radius: 6px; cursor: pointer; }
      button:hover { background-color: #16a34a; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Sentinel Vision</h1>
      <p>Upload Image for Authentication</p>
      <form action="/analyze" method="post" enctype="multipart/form-data">
        <input type="file" name="file" required><br>
        <button type="submit">Analyse Media</button>
      </form>
    </div>
  </body>
</html>

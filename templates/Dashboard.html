<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Sentinel Vision - Analysis Dashboard</title>
    <style>
      body { font-family: Arial, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 40px; }
      .container { max-width: 800px; margin: 0 auto; background-color: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3); }
      h1 { color: #22c55e; border-bottom: 2px solid #334155; padding-bottom: 10px; }
      .report-box { background-color: #0f172a; border: 1px solid #334155; padding: 20px; border-radius: 8px; font-family: monospace; white-space: pre-wrap; color: #38bdf8; overflow-x: auto; }
      .btn { display: inline-block; margin-top: 20px; background-color: #3b82f6; color: white; padding: 10px 20px; text-decoration: none; border-radius: 6px; }
      .btn:hover { background-color: #2563eb; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Analysis Dashboard</h1>
      <p><strong>Analyzed File:</strong> {{ filename }}</p>

      <h2>Layer 1: Metadata & Technical Report</h2>
      <div class="report-box">{{ report }}</div>

      <a href="/" class="btn">← Upload Another File</a>
    </div>
  </body>
</html>
